<script>
// One link for the QR and for sharing: the phone's own store, the query passed on where the store
// keeps it (Play's install referrer; Apple's campaign token). APPLE_APP_ID: fill in once the app is live.
(function () {
  var q = location.search.replace(/^\?/, "");
  var ua = navigator.userAgent || "";
  var apple = "https://apps.apple.com/app/idAPPLE_APP_ID?pt=marbleworlds&ct=" + encodeURIComponent(q || "qr") + "&mt=8";
  var play = "https://play.google.com/store/apps/details?id=com.nixare.marbleworlds&referrer=" + encodeURIComponent(q || "utm_source=qr");
  if (/android/i.test(ua)) location.replace(play);
  else if (/iphone|ipad|ipod/i.test(ua) || (/macintosh/i.test(ua) && "ontouchend" in document)) location.replace(apple);
  window.__stores = { apple: apple, play: play };
})();
</script></head><body class="page">
